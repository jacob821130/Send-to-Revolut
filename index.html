
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #171717;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.06);
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 1.5px solid #dedede;
      border-radius: 12px;
      padding: 0 15px;
      height: 58px;
      transition: border-color .2s;
    }

    .input-box:focus-within {
      border-color: #171717;
    }

    .at {
      font-size: 20px;
      color: #888;
      margin-right: 8px;
    }

    input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
      background: transparent;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      height: 56px;
      margin-top: 22px;
      border: none;
      border-radius: 30px;
      background: #171717;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:disabled {
      background: #d8d8d8;
      cursor: not-allowed;
    }

    button:not(:disabled):hover {
      opacity: .85;
    }

    .notice {
      margin-top: 25px;
      text-align: center;
      color: #999;
      font-size: 11px;
    }

    .result {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="brand">Transfer.</div>

    <h1>Send money</h1>
    <p class="subtitle">
      Enter a recipient's Revtag to get started.
    </p>

    <form id="transferForm">
      <label for="revtag">Recipient's Revtag</label>

      <div class="input-box">
        <span class="at">@</span>
        <input
          id="revtag"
          type="text"
          placeholder="Enter Revtag"
          autocomplete="off"
          required
        >
      </div>

      <button id="continueBtn" type="submit" disabled>
        Continue →
      </button>
    </form>

    <div class="result" id="result"></div>

    <p class="notice">
      Independent interface · Not affiliated with Revolut
    </p>
  </main>

  <script>
    const input = document.getElementById("revtag");
    const button = document.getElementById("continueBtn");
    const form = document.getElementById("transferForm");
    const result = document.getElementById("result");

    input.addEventListener("input", () => {
      button.disabled = input.value.trim().length === 0;
      result.textContent = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const revtag = input.value.trim().replace(/^@/, "");

      window.location.replace(`https://revolut.me/${revtag}`);
    });
  </script>

</body>
</html>
